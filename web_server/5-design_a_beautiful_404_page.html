<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Page not found</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0f1720;color:#e8eef4;font-family:Georgia,serif;text-align:center}
  .box{padding:24px}
  h1{font-size:7rem;margin:0;color:#e0a526;letter-spacing:.05em}
  p{font-size:1.4rem;margin:12px 0}
  .small{font-size:1rem;color:#9aa8b6;font-family:system-ui,sans-serif}
  a{display:inline-block;margin-top:24px;padding:10px 22px;border:2px solid #6aa2f5;
    color:#6aa2f5;text-decoration:none;border-radius:6px;font-family:system-ui,sans-serif}
  a:hover{background:#6aa2f5;color:#0f1720}
</style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>Ceci n'est pas une page</p>
    <p class="small">This is not a page. The server looked everywhere and found nothing.</p>
    <a href="/">Back to the home page</a>
  </div>
</body>
</html>
